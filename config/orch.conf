[general]
default_agent = claude
log_level = info
output_format = text
history_file = ~/.local/share/orch/history.jsonl

[fallback]
order = claude codex gemini

[routing]
generate = claude
review = codex
explain = gemini
refactor = claude
test = codex
debug = claude
general = claude

[claude]
model = claude-sonnet-4-20250514
permission_mode = default

[codex]
model =
sandbox = read-only
extra_flags = --skip-git-repo-check

[gemini]
model = gemini-2.5-flash
approval_mode = default

[fanout]
agents = claude codex gemini
timeout = 120

[cost]
enabled = true
budget_warn = 5.00
